<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Secreta</title>
  
  <!-- Configurações para Ícone e Aplicativo (PWA) -->
  <link rel="icon" type="image/png" href="icone.png">
  <link rel="apple-touch-icon" href="icone.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111827">

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f3f3f5;
      --header-bg: #111827;
      --dot1-color: #f59e0b;
      --dot2-color: #818cf8;
      --dot3-color: #6b7280;
      --border-color: #374151;
      --card-default-bg: #475569;

      /* Cores personalizáveis de botões */
      --btn-add-bg: #4ade80;
      --btn-backup-bg: #3b82f6;
      --btn-import-bg: #8b5cf6;

      /* Cores personalizáveis dos status */
      --status-concluido-bg: #22c55e;
      --status-andamento-bg: #3b82f6;
      --status-hiatus-bg: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Quicksand', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      /* Background quadriculado suave */
      background-image: 
        linear-gradient(to right, rgba(200, 200, 220, 0.3) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(200, 200, 220, 0.3) 1px, transparent 1px);
      background-size: 24px 24px;
      min-height: 100vh;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Container Principal */
    .app-window {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 3px solid #111827;
      overflow: hidden;
      margin-bottom: 30px;
    }

    /* Barra Superior da Janela */
    .window-header {
      background-color: var(--header-bg);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      transition: background-color 0.3s ease;
    }

    .window-title {
      color: #ffffff;
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .palette-toggle-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .palette-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .window-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      transition: background-color 0.3s ease;
    }
    .dot-1 { background-color: var(--dot1-color); }
    .dot-2 { background-color: var(--dot2-color); }
    .dot-3 { background-color: var(--dot3-color); }

    /* Barra de Personalização (Escondida por padrão) */
    .customizer-bar {
      background: rgba(17, 24, 39, 0.05);
      border-bottom: 1px solid #e5e7eb;
      padding: 15px;
      display: none;
      flex-direction: column;
      gap: 12px;
      font-size: 0.85rem;
    }

    .customizer-bar.active {
      display: flex;
    }

    .customizer-title {
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .customizer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .color-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .color-field label {
      font-weight: 600;
      color: #374151;
      font-size: 0.8rem;
    }

    .color-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-picker-input {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border: 2px solid #ccc;
      border-radius: 50%;
      cursor: pointer;
      background: none;
      padding: 0;
      overflow: hidden;
      flex-shrink: 0;
    }
    .color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-input::-webkit-color-swatch { border: none; border-radius: 50%; }

    .hex-text-input {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    /* Barra de Ações e Filtros */
    .actions-bar {
      padding: 15px 20px;
      background-color: #f8fafc;
      border-bottom: 1px dashed #cbd5e1;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
    }

    .search-filter-box {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
    }

    .search-input, .filter-select {
      padding: 8px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input {
      flex: 1;
      min-width: 160px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 2px solid #111827;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      box-shadow: 2px 2px 0px #111827;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #111827;
    }

    .btn-add { background-color: var(--btn-add-bg); color: #111827; }
    .btn-backup { background-color: var(--btn-backup-bg); color: #ffffff; }
    .btn-import { background-color: var(--btn-import-bg); color: #ffffff; }

    /* Grid de Cards */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* Card do Manhwa */
    .card {
      background-color: var(--card-default-bg);
      border-radius: 12px;
      padding: 8px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      border: 2px solid #111827;
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.2);
      position: relative;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-cover-wrapper {
      position: relative;
      width: 100%;
      height: 240px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #1e293b;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      min-height: 2.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }

    .card-details {
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-details li {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-details a {
      color: #fde047;
      text-decoration: underline;
      font-weight: 700;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      gap: 4px;
      position: relative;
    }

    /* Botão de Engrenagem e Menu Dropdown nos Cards */
    .gear-menu-container {
      position: relative;
    }

    .btn-gear {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-gear:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .gear-dropdown {
      display: none;
      position: absolute;
      bottom: 110%;
      left: 0;
      background: #ffffff;
      border: 2px solid #111827;
      border-radius: 8px;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.3);
      z-index: 20;
      overflow: hidden;
      min-width: 100px;
    }

    .gear-dropdown.show {
      display: flex;
      flex-direction: column;
    }

    .gear-dropdown-btn {
      background: none;
      border: none;
      padding: 8px 12px;
      text-align: left;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gear-dropdown-btn:hover {
      background: #f1f5f9;
    }

    .gear-dropdown-btn.delete {
      color: #ef4444;
      border-top: 1px solid #e2e8f0;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      margin-left: auto;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }
    .status-concluido { background-color: var(--status-concluido-bg); color: #fff; }
    .status-andamento { background-color: var(--status-andamento-bg); color: #fff; }
    .status-hiatus { background-color: var(--status-hiatus-bg); color: #fff; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      border: 3px solid #111827;
      box-shadow: 6px 6px 0px #111827;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: #111827;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #374151;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hidden-file-input {
      display: none;
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
        padding: 12px;
      }
      .card-cover-wrapper { height: 180px; }
      .actions-bar { flex-direction: column; align-items: stretch; }
      .search-filter-box { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Janela Principal -->
  <div class="app-window">
    <!-- Barra Superior -->
    <div class="window-header" id="windowHeader">
      <div class="window-title">
        <button class="palette-toggle-btn" id="btnToggleCustomizer" title="Personalizar Cores">🎨</button>
        <span id="appTitleText">Biblioteca Secreta</span>
      </div>
      <div class="window-controls">
        <span class="dot dot-1" id="dot1"></span>
        <span class="dot dot-2" id="dot2"></span>
        <span class="dot dot-3" id="dot3"></span>
      </div>
    </div>

    <!-- Barra de Personalização Avançada com Códigos HEX -->
    <div class="customizer-bar" id="customizerBar">
      <div class="customizer-title">🎨 Personalização Geral de Cores (Código HEX)</div>
      <div class="customizer-grid">
        
        <!-- Fundo Topo e Bolinhas -->
        <div class="color-field">
          <label>Fundo Topo</label>
          <div class="color-input-group">
            <input type="color" id="pickerHeaderBg" class="color-picker-input">
            <input type="text" id="hexHeaderBg" class="hex-text-input" placeholder="#111827">
          </div>
        </div>

        <div class="color-field">
          <label>Bolinha 1</label>
          <div class="color-input-group">
            <input type="color" id="pickerDot1" class="color-picker-input">
            <input type="text" id="hexDot1" class="hex-text-input" placeholder="#F59E0B">
          </div>
        </div>

        <div class="color-field">
          <label>Bolinha 2</label>
          <div class="color-input-group">
            <input type="color" id="pickerDot2" class="color-picker-input">
            <input type="text" id="hexDot2" class="hex-text-input" placeholder="#818CF8">
          </div>
        </div>

        <div class="color-field">
          <label>Bolinha 3</label>
          <div class="color-input-group">
            <input type="color" id="pickerDot3" class="color-picker-input">
            <input type="text" id="hexDot3" class="hex-text-input" placeholder="#6B7280">
          </div>
        </div>

        <!-- Botões -->
        <div class="color-field">
          <label>Btn Novo Card</label>
          <div class="color-input-group">
            <input type="color" id="pickerBtnAdd" class="color-picker-input">
            <input type="text" id="hexBtnAdd" class="hex-text-input" placeholder="#4ADE80">
          </div>
        </div>

        <div class="color-field">
          <label>Btn Backup</label>
          <div class="color-input-group">
            <input type="color" id="pickerBtnBackup" class="color-picker-input">
            <input type="text" id="hexBtnBackup" class="hex-text-input" placeholder="#3B82F6">
          </div>
        </div>

        <div class="color-field">
          <label>Btn Restaurar</label>
          <div class="color-input-group">
            <input type="color" id="pickerBtnImport" class="color-picker-input">
            <input type="text" id="hexBtnImport" class="hex-text-input" placeholder="#8B5CF6">
          </div>
        </div>

        <!-- Badges de Status -->
        <div class="color-field">
          <label>Status Concluído</label>
          <div class="color-input-group">
            <input type="color" id="pickerStatusConcluido" class="color-picker-input">
            <input type="text" id="hexStatusConcluido" class="hex-text-input" placeholder="#22C55E">
          </div>
        </div>

        <div class="color-field">
          <label>Status Andamento</label>
          <div class="color-input-group">
            <input type="color" id="pickerStatusAndamento" class="color-picker-input">
            <input type="text" id="hexStatusAndamento" class="hex-text-input" placeholder="#3B82F6">
          </div>
        </div>

        <div class="color-field">
          <label>Status Hiatus</label>
          <div class="color-input-group">
            <input type="color" id="pickerStatusHiatus" class="color-picker-input">
            <input type="text" id="hexStatusHiatus" class="hex-text-input" placeholder="#EF4444">
          </div>
        </div>

      </div>
    </div>

    <!-- Barra de Ações & Filtro -->
    <div class="actions-bar">
      <div class="search-filter-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar título ou link...">
        <select id="filterStatus" class="filter-select">
          <option value="all">Todos os Status</option>
          <option value="Concluído">Concluídos</option>
          <option value="Andamento">Em Andamento</option>
          <option value="Hiatus">Hiatus</option>
        </select>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn btn-add" id="btnOpenAddModal">➕ Novo Card</button>
        <button class="btn btn-backup" id="btnExportBackup" title="Baixar arquivo de segurança com seus manhwas">📥 Backup</button>
        <button class="btn btn-import" id="btnImportBackup" title="Restaurar backup do celular">📤 Restaurar</button>
      </div>
    </div>

    <!-- Grid de Cards -->
    <div class="grid-container" id="manhwaGrid"></div>
  </div>

  <input type="file" id="backupFileInput" class="hidden-file-input" accept=".json">

  <!-- Modal Adicionar/Editar -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title" id="modalTitle">Adicionar Manhwa</div>
      <form id="manhwaForm">
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="form-group">
          <label for="inputTitle">Título do Manhwa</label>
          <input type="text" id="inputTitle" class="form-control" required placeholder="Ex: Roses and Champagne">
        </div>

        <div class="form-group">
          <label>Capa (Escolher da Galeria/Celular)</label>
          <input type="file" id="inputCoverFile" class="form-control" accept="image/*">
          <small style="color: #64748b; font-size:0.75rem;">Ou cole uma URL de imagem abaixo:</small>
          <input type="url" id="inputCoverUrl" class="form-control" style="margin-top:4px;" placeholder="https://exemplo.com/imagem.jpg">
        </div>

        <div class="form-group">
          <label for="inputStatus">Status</label>
          <select id="inputStatus" class="form-control">
            <option value="Concluído">Concluído</option>
            <option value="Andamento">Andamento</option>
            <option value="Hiatus">Hiatus</option>
          </select>
        </div>

        <div class="form-group">
          <label for="inputCap">Capítulos</label>
          <input type="text" id="inputCap" class="form-control" placeholder="Ex: 55 + 37.5 Side">
        </div>

        <div class="form-group">
          <label for="inputLink">Link Completo (ex: https://site.com)</label>
          <input type="text" id="inputLink" class="form-control" placeholder="https://3xyaoi.com">
        </div>

        <div class="form-group">
          <label for="inputColor">Cor de Fundo do Card (HEX)</label>
          <div class="color-picker-wrapper">
            <input type="color" id="inputColorPicker" class="color-picker-input" value="#475569">
            <input type="text" id="inputColorHex" class="form-control" style="width: 120px;" value="#475569" placeholder="#475569">
          </div>
        </div>

        <div class="modal-buttons">
          <button type="button" class="btn" style="background:#cbd5e1" id="btnCancelModal">Cancelar</button>
          <button type="submit" class="btn btn-add">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const initialManhwas = [
      { title: "Roses and Champagne", cover: "https://picsum.photos/seed/roses/300/450", status: "Concluído", cap: "55 + 37.5 Side", link: "https://fbsquadx.com", bgColor: "#111827" },
      { title: "Dear Door", cover: "https://picsum.photos/seed/deardoor/300/450", status: "Concluído", cap: "130.5 + 33.5", link: "https://3xyaoi.com", bgColor: "#b91c1c" },
      { title: "Xxx Buddy", cover: "https://picsum.photos/seed/xxxbuddy/300/450", status: "Concluído", cap: "103 + 14 Side", link: "https://3xyaoi.com", bgColor: "#2563eb" },
      { title: "Mr.A's Farm", cover: "https://picsum.photos/seed/mrafarm/300/450", status: "Hiatus", cap: "24.2", link: "https://3xyaoi.com", bgColor: "#334155" },
      { title: "A Lovely Meal", cover: "https://picsum.photos/seed/lovely/300/450", status: "Andamento", cap: "25", link: "https://3xyaoi.com", bgColor: "#475569" },
      { title: "Killer Crush", cover: "https://picsum.photos/seed/killercrush/300/450", status: "Concluído", cap: "77 + 4 Side", link: "https://3xyaoi.com", bgColor: "#475569" },
      { title: "The Little Pigs", cover: "https://picsum.photos/seed/pigs/300/450", status: "Concluído", cap: "8", link: "https://3xyaoi.com", bgColor: "#475569" },
      { title: "The Black Knight Under the Red Curse", cover: "https://picsum.photos/seed/blackknight/300/450", status: "Concluído", cap: "5 + 3 Side", link: "https://3xyaoi.com", bgColor: "#1e3a8a" },
      { title: "Like Mother Like Son", cover: "https://picsum.photos/seed/likemother/300/450", status: "Concluído", cap: "8+ 2 Extras", link: "https://3xyaoi.com", bgColor: "#64748b" },
      { title: "Hot and Cold", cover: "https://picsum.photos/seed/hotcold/300/450", status: "Concluído", cap: "3", link: "https://3xyaoi.com", bgColor: "#64748b" },
      { title: "Help me Teacher!", cover: "https://picsum.photos/seed/helpteacher/300/450", status: "Concluído", cap: "10", link: "https://3xyaoi.com", bgColor: "#64748b" },
      { title: "Disorder and Desire", cover: "https://picsum.photos/seed/disorder/300/450", status: "Andamento", cap: "8", link: "https://3xyaoi.com", bgColor: "#64748b" }
    ];

    const STORAGE_KEY = 'secret_library_manhwas';
    const THEME_KEY = 'secret_library_theme';

    let manhwas = [];
    let customTheme = {
      headerBg: '#111827',
      dot1: '#f59e0b',
      dot2: '#818cf8',
      dot3: '#6b7280',
      btnAdd: '#4ade80',
      btnBackup: '#3b82f6',
      btnImport: '#8b5cf6',
      statusConcluido: '#22c55e',
      statusAndamento: '#3b82f6',
      statusHiatus: '#ef4444'
    };

    function loadData() {
      const savedData = localStorage.getItem(STORAGE_KEY);
      if (savedData) {
        try {
          manhwas = JSON.parse(savedData);
        } catch(e) {
          manhwas = [...initialManhwas];
        }
      } else {
        manhwas = [...initialManhwas];
      }

      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme) {
        try {
          customTheme = { ...customTheme, ...JSON.parse(savedTheme) };
        } catch(e){}
      }
      applyTheme();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(manhwas));
    }

    function saveTheme() {
      localStorage.setItem(THEME_KEY, JSON.stringify(customTheme));
    }

    function applyTheme() {
      const root = document.documentElement;
      root.style.setProperty('--header-bg', customTheme.headerBg);
      root.style.setProperty('--dot1-color', customTheme.dot1);
      root.style.setProperty('--dot2-color', customTheme.dot2);
      root.style.setProperty('--dot3-color', customTheme.dot3);
      root.style.setProperty('--btn-add-bg', customTheme.btnAdd);
      root.style.setProperty('--btn-backup-bg', customTheme.btnBackup);
      root.style.setProperty('--btn-import-bg', customTheme.btnImport);
      root.style.setProperty('--status-concluido-bg', customTheme.statusConcluido);
      root.style.setProperty('--status-andamento-bg', customTheme.statusAndamento);
      root.style.setProperty('--status-hiatus-bg', customTheme.statusHiatus);

      // Sync inputs
      syncInput('pickerHeaderBg', 'hexHeaderBg', customTheme.headerBg);
      syncInput('pickerDot1', 'hexDot1', customTheme.dot1);
      syncInput('pickerDot2', 'hexDot2', customTheme.dot2);
      syncInput('pickerDot3', 'hexDot3', customTheme.dot3);
      syncInput('pickerBtnAdd', 'hexBtnAdd', customTheme.btnAdd);
      syncInput('pickerBtnBackup', 'hexBtnBackup', customTheme.btnBackup);
      syncInput('pickerBtnImport', 'hexBtnImport', customTheme.btnImport);
      syncInput('pickerStatusConcluido', 'hexStatusConcluido', customTheme.statusConcluido);
      syncInput('pickerStatusAndamento', 'hexStatusAndamento', customTheme.statusAndamento);
      syncInput('pickerStatusHiatus', 'hexStatusHiatus', customTheme.statusHiatus);
    }

    function syncInput(pickerId, hexId, value) {
      if(document.getElementById(pickerId)) document.getElementById(pickerId).value = value;
      if(document.getElementById(hexId)) document.getElementById(hexId).value = value;
    }

    function bindColorSync(pickerId, hexId, themeKey) {
      const picker = document.getElementById(pickerId);
      const hex = document.getElementById(hexId);

      picker.addEventListener('input', (e) => {
        hex.value = e.target.value;
        customTheme[themeKey] = e.target.value;
        applyTheme();
        saveTheme();
      });

      hex.addEventListener('input', (e) => {
        let val = e.target.value;
        if (!val.startsWith('#')) val = '#' + val;
        if (/^#[0-9A-F]{6}$/i.test(val)) {
          picker.value = val;
          customTheme[themeKey] = val;
          applyTheme();
          saveTheme();
        }
      });
    }

    function renderGrid() {
      const grid = document.getElementById('manhwaGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const filterVal = document.getElementById('filterStatus').value;

      grid.innerHTML = '';

      manhwas.forEach((item, index) => {
        const matchesSearch = item.title.toLowerCase().includes(searchVal) || item.link.toLowerCase().includes(searchVal);
        const matchesFilter = filterVal === 'all' || item.status === filterVal;

        if (matchesSearch && matchesFilter) {
          const card = document.createElement('div');
          card.className = 'card';
          if (item.bgColor) {
            card.style.backgroundColor = item.bgColor;
          }

          let badgeClass = 'status-concluido';
          if (item.status === 'Andamento') badgeClass = 'status-andamento';
          if (item.status === 'Hiatus') badgeClass = 'status-hiatus';

          // Garante que o link tenha formato correto com protocolo
          let fullUrl = item.link;
          if (fullUrl && !fullUrl.startsWith('http://') && !fullUrl.startsWith('https://')) {
            fullUrl = 'https://' + fullUrl;
          }

          card.innerHTML = `
            <div class="card-cover-wrapper">
              <img src="${item.cover}" class="card-cover" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x450?text=Sem+Capa'">
            </div>
            <div class="card-title">${item.title}</div>
            <ul class="card-details">
              <li>📌 Status: <i>${item.status}</i></li>
              <li>📖 Cap: ${item.cap}</li>
              <li>🔗 Link: <a href="${fullUrl}" target="_blank" rel="noopener noreferrer">${item.link}</a></li>
            </ul>
            <div class="card-footer">
              <div class="gear-menu-container">
                <button class="btn-gear" onclick="toggleGearMenu(event, ${index})">⚙️</button>
                <div class="gear-dropdown" id="gearDropdown-${index}">
                  <button class="gear-dropdown-btn" onclick="editCard(${index})">✏️ Editar</button>
                  <button class="gear-dropdown-btn delete" onclick="deleteCard(${index})">🗑️ Excluir</button>
                </div>
              </div>
              <span class="status-badge ${badgeClass}">${item.status}</span>
            </div>
          `;
          grid.appendChild(card);
        }
      });
    }

    // Controle do Menu da Engrenagem ⚙️
    window.toggleGearMenu = function(event, index) {
      event.stopPropagation();
      // Fecha outros menus abertos
      document.querySelectorAll('.gear-dropdown').forEach(el => {
        if(el.id !== `gearDropdown-${index}`) el.classList.remove('show');
      });

      const dropdown = document.getElementById(`gearDropdown-${index}`);
      if(dropdown) dropdown.classList.toggle('show');
    };

    // Fecha o menu da engrenagem se clicar fora
    document.addEventListener('click', () => {
      document.querySelectorAll('.gear-dropdown').forEach(el => el.classList.remove('show'));
    });

    const modalOverlay = document.getElementById('modalOverlay');
    const manhwaForm = document.getElementById('manhwaForm');

    function openModal(index = -1) {
      document.getElementById('editIndex').value = index;
      document.getElementById('inputCoverFile').value = '';
      
      if (index >= 0) {
        const item = manhwas[index];
        document.getElementById('modalTitle').innerText = 'Editar Manhwa';
        document.getElementById('inputTitle').value = item.title;
        document.getElementById('inputCoverUrl').value = item.cover.startsWith('data:') ? '' : item.cover;
        document.getElementById('inputStatus').value = item.status;
        document.getElementById('inputCap').value = item.cap;
        document.getElementById('inputLink').value = item.link;
        const color = item.bgColor || '#475569';
        document.getElementById('inputColorPicker').value = color;
        document.getElementById('inputColorHex').value = color;
      } else {
        document.getElementById('modalTitle').innerText = 'Novo Manhwa';
        manhwaForm.reset();
        document.getElementById('inputColorPicker').value = '#475569';
        document.getElementById('inputColorHex').value = '#475569';
      }
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    manhwaForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const index = parseInt(document.getElementById('editIndex').value);
      const fileInput = document.getElementById('inputCoverFile');
      const urlInput = document.getElementById('inputCoverUrl').value;
      
      const saveCardData = (coverSrc) => {
        const cardObj = {
          title: document.getElementById('inputTitle').value,
          cover: coverSrc || 'https://via.placeholder.com/300x450?text=Sem+Capa',
          status: document.getElementById('inputStatus').value,
          cap: document.getElementById('inputCap').value,
          link: document.getElementById('inputLink').value,
          bgColor: document.getElementById('inputColorHex').value
        };

        if (index >= 0) {
          manhwas[index] = cardObj;
        } else {
          manhwas.unshift(cardObj);
        }

        saveData();
        renderGrid();
        closeModal();
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          saveCardData(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        let existingCover = (index >= 0) ? manhwas[index].cover : '';
        saveCardData(urlInput || existingCover);
      }
    });

    window.editCard = function(index) {
      openModal(index);
    };

    window.deleteCard = function(index) {
      if (confirm(`Deseja mesmo apagar "${manhwas[index].title}"?`)) {
        manhwas.splice(index, 1);
        saveData();
        renderGrid();
      }
    };

    // Exportar e Importar Backup
    document.getElementById('btnExportBackup').addEventListener('click', function() {
      const dataToExport = {
        manhwas: manhwas,
        theme: customTheme,
        exportDate: new Date().toISOString()
      };
      const jsonStr = JSON.stringify(dataToExport, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `biblioteca_secreta_backup_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    const backupFileInput = document.getElementById('backupFileInput');
    document.getElementById('btnImportBackup').addEventListener('click', function() {
      backupFileInput.click();
    });

    backupFileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.manhwas && Array.isArray(imported.manhwas)) {
            manhwas = imported.manhwas;
            saveData();
          }
          if (imported.theme) {
            customTheme = { ...customTheme, ...imported.theme };
            saveTheme();
            applyTheme();
          }
          renderGrid();
          alert('Backup restaurado com sucesso!');
        } catch(err) {
          alert('Erro ao carregar ficheiro de backup. Certifique-se de selecionar um arquivo .json válido.');
        }
      };
      reader.readAsText(file);
      backupFileInput.value = '';
    });

    // Toggle da barra de personalização ao clicar na paleta 🎨
    document.getElementById('btnToggleCustomizer').addEventListener('click', () => {
      document.getElementById('customizerBar').classList.toggle('active');
    });

    document.getElementById('btnOpenAddModal').addEventListener('click', () => openModal(-1));
    document.getElementById('btnCancelModal').addEventListener('click', closeModal);
    document.getElementById('searchInput').addEventListener('input', renderGrid);
    document.getElementById('filterStatus').addEventListener('change', renderGrid);

    // Color picker e Hex sync do Modal
    const picker = document.getElementById('inputColorPicker');
    const hexInput = document.getElementById('inputColorHex');
    picker.addEventListener('input', (e) => hexInput.value = e.target.value);
    hexInput.addEventListener('input', (e) => picker.value = e.target.value);

    // Binds dos seletores da barra de personalização
    bindColorSync('pickerHeaderBg', 'hexHeaderBg', 'headerBg');
    bindColorSync('pickerDot1', 'hexDot1', 'dot1');
    bindColorSync('pickerDot2', 'hexDot2', 'dot2');
    bindColorSync('pickerDot3', 'hexDot3', 'dot3');
    bindColorSync('pickerBtnAdd', 'hexBtnAdd', 'btnAdd');
    bindColorSync('pickerBtnBackup', 'hexBtnBackup', 'btnBackup');
    bindColorSync('pickerBtnImport', 'hexBtnImport', 'btnImport');
    bindColorSync('pickerStatusConcluido', 'hexStatusConcluido', 'statusConcluido');
    bindColorSync('pickerStatusAndamento', 'hexStatusAndamento', 'statusAndamento');
    bindColorSync('pickerStatusHiatus', 'hexStatusHiatus', 'statusHiatus');

    loadData();
    renderGrid();
  </script>
</body>
</html>
